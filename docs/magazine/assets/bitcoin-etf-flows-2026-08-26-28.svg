  <text x="70" y="512" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="11" fill="#7a858f">세 거래일 합계 +$272.6m. 8월 28일 순유출은 단방향 서사를 약화하지만 분배(distribution)를 단독으로 입증하지 않는다.</text>
