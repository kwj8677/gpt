<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">한국 경찰 통계에 인용된 소매치기 발생 건수, 2011년과 2019년</title>
  <desc id="desc">2011년 2,378건에서 2019년 535건으로 감소했다. 이는 두 시점의 경찰 기록 건수이며 인구당 피해율이 아니다.</desc>
  <rect width="900" height="520" fill="#fbfaf7"/>
  <text x="70" y="42" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="24" font-weight="700" fill="#17212b">경찰 기록상 소매치기 발생 건수</text>
  <text x="70" y="68" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="14" fill="#5a6672">한국 · 2011년과 2019년 · 단위: 건</text>
  <g stroke="#d8dde3" stroke-width="1">
    <line x1="100" y1="400" x2="830" y2="400"/>
    <line x1="100" y1="336" x2="830" y2="336"/>
    <line x1="100" y1="272" x2="830" y2="272"/>
    <line x1="100" y1="208" x2="830" y2="208"/>
    <line x1="100" y1="144" x2="830" y2="144"/>
    <line x1="100" y1="80" x2="830" y2="80"/>
  </g>
  <g font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="12" fill="#66717c" text-anchor="end">
    <text x="90" y="404">0</text>
    <text x="90" y="340">500</text>
    <text x="90" y="276">1,000</text>
    <text x="90" y="212">1,500</text>
    <text x="90" y="148">2,000</text>
    <text x="90" y="84">2,500건</text>
  </g>
  <rect x="220" y="95.6" width="180" height="304.4" fill="#176b87" rx="3"/>
  <rect x="560" y="331.5" width="180" height="68.5" fill="#c26a3d" rx="3"/>
  <g font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" text-anchor="middle">
    <text x="310" y="84" font-size="18" font-weight="700" fill="#17212b">2,378건</text>
    <text x="650" y="320" font-size="18" font-weight="700" fill="#17212b">535건</text>
    <text x="310" y="426" font-size="14" fill="#49545f">2011</text>
    <text x="650" y="426" font-size="14" fill="#49545f">2019</text>
  </g>
  <text x="475" y="160" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="17" font-weight="700" fill="#8b3f2a" text-anchor="middle">−77.5%</text>
  <text x="70" y="468" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="12" fill="#5a6672">출처: 한국 경찰청 범죄통계를 인용한 조선일보 2021-06-23; 원문 evidence dossier.</text>
  <text x="70" y="488" font-family="'Noto Sans KR', 'Pretendard', Arial, sans-serif" font-size="11" fill="#7a858f">주의: 신고·분류된 발생 건수의 두 시점 비교다. CCTV나 현금 감소의 단독 인과효과를 나타내지 않는다.</text>
</svg>
